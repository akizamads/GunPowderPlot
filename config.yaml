scan:
  default_timeout: 7
  default_ports: 21,22,25,53,80,110,143,443,445,3306,3389,5432,6379,8080,8443
  max_threads: 100
  user_agent: Mozilla/5.0 (compatible; VScanPro/3.1)
report:
  output_dir: reports
  formats:
  - text
  - json
  redact_sensitive: true
exploit:
  max_jobs: 5
  default_strategy: moderate
  safety_timeout: 30
ui:
  color: true
  banner: enterprise
